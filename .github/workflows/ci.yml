name: CI

# Trigger: push to main only (no pull_request — single branch workflow)
on:
  push:
    branches:
      - main

jobs:
  # ─── Job 1: Backend unit + integration tests ────────────────────────────────
  backend-tests:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    env:
      # Tests mock all Gemini calls — a dummy key prevents import errors
      GEMINI_API_KEY: "ci-dummy-key-tests-mock-gemini"
      # Any fixed string works for JWT in tests
      SECRET_KEY: "ci-test-secret-key-do-not-use-in-production"
      # Tests use in-memory SQLite (conftest.py StaticPool) — this is not used
      DATABASE_URL: "sqlite:///./test_ci.db"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest (unit + integration)
        run: python -m pytest tests/test_grading.py tests/test_ai_service.py tests/test_integration.py -v --tb=short

  # ─── Job 2: Frontend lint ────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend Lint (oxlint)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  # ─── Job 3: Playwright E2E (critical-path) ────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright / Chromium)
    runs-on: ubuntu-latest
    # Run after both other jobs succeed so we know the app is healthy
    needs: [backend-tests, frontend-lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright Chromium browser
        working-directory: ./frontend
        run: npx playwright install chromium --with-deps

      - name: Run Playwright E2E tests
        working-directory: ./frontend
        env:
          CI: "true"
          # Backend started by playwright.config.ts webServer block with TEST_MODE=1
          # No Gemini key needed — seed endpoint bypasses AI generation
          GEMINI_API_KEY: "ci-e2e-dummy-no-gemini-calls"
          SECRET_KEY:     "ci-e2e-secret-key"
          DATABASE_URL:   "sqlite:///./e2e_test.db"
        run: |
          # In CI, playwright.config.ts starts the backend itself via webServer.
          # The backend command uses 'python' from PATH (set up by setup-python above).
          # Override the config's Windows-specific venv path for Linux CI:
          PLAYWRIGHT_BACKEND_CMD="python -m uvicorn app.main:app --host 127.0.0.1 --port 8000" \
          npx playwright test --project=chromium

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
