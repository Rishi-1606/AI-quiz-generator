name: CI

# Trigger: push to main only (no pull_request — single branch workflow)
on:
  push:
    branches:
      - main

jobs:
  # ─── Job 1: Backend unit + integration tests ────────────────────────────────
  backend-tests:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    env:
      # Tests mock all Gemini calls — a dummy key prevents import errors
      GEMINI_API_KEY: "ci-dummy-key-tests-mock-gemini"
      # Any fixed string works for JWT in tests
      SECRET_KEY: "ci-test-secret-key-do-not-use-in-production"
      # Tests use in-memory SQLite (conftest.py StaticPool) — this is not used
      DATABASE_URL: "sqlite:///./test_ci.db"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest (unit + integration)
        run: python -m pytest tests/test_grading.py tests/test_ai_service.py tests/test_integration.py -v --tb=short

  # ─── Job 2: Frontend lint ────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend Lint (oxlint)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint
